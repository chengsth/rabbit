<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rabbit &amp; Memo — S.W.A.T. Creature Cleanup</title>
<style>
  :root{
    --cream:#fff6ee; --cream2:#ffe9dc; --ink:#5b4a52; --muted:#a58e98;
    --pink:#f7b6c8; --pink2:#f194ac; --lav:#cdb0ec; --lav2:#b8a5ee;
    --mint:#8ed0a0; --amber:#ffb24d; --navy:#5b6b8f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Nunito',ui-rounded,'Segoe UI',system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 20% -10%, #fde4ef 0%, transparent 60%),
      radial-gradient(1000px 500px at 110% 0%, #e6ecfb 0%, transparent 55%),
      #f4e2f7;
    color:var(--ink);
    display:flex;align-items:flex-start;justify-content:center;
    padding:14px;min-height:100%;
  }
  /* auto margins centre the game but still let a tall page scroll from the top */
  .game{width:100%;max-width:1180px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;}
  .stage{background:var(--cream);border-radius:26px;padding:12px;
    box-shadow:0 18px 40px -18px rgba(180,120,160,.5);}
  .hud{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .title{font-weight:800;font-size:17px;margin-right:auto;color:var(--pink2);letter-spacing:.2px;white-space:nowrap;}
  .chip{background:var(--cream2);border-radius:15px;padding:7px 11px;font-weight:600;
    display:flex;align-items:center;gap:6px;font-size:14px;}
  .chip b{font-weight:800;font-size:16px;}
  .hpwrap{background:var(--cream2);border-radius:15px;padding:6px 11px;display:flex;align-items:center;gap:7px;}
  .hpbar{width:88px;height:12px;border-radius:7px;background:#f0d9e2;overflow:hidden;
    box-shadow:inset 0 2px 5px rgba(180,120,160,.3);}
  .hpbar i{display:block;height:100%;width:100%;border-radius:7px;transition:width .15s ease;
    background:linear-gradient(90deg,#8ed0a0,#c8e79a);}
  canvas{width:100%;height:auto;display:block;border-radius:18px;background:#e8eef7;
    cursor:crosshair;touch-action:none;}

  .panel{background:var(--cream);border-radius:26px;padding:16px;
    box-shadow:0 18px 40px -18px rgba(180,120,160,.5);display:flex;flex-direction:column;}
  .panel h2{margin:2px 0 4px;font-size:18px;font-weight:800;}
  .hint{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.4;min-height:36px;}
  .kit{display:flex;flex-direction:column;gap:8px;}
  .wp{border:2px solid var(--cream2);border-radius:18px;padding:9px 11px;cursor:pointer;
    background:#fffdfb;transition:.12s;display:flex;gap:10px;align-items:center;text-align:left;
    font-family:inherit;color:inherit;width:100%;}
  .wp:hover{border-color:var(--lav);transform:translateY(-1px);}
  .wp.sel{border-color:var(--lav2);background:#f6efff;box-shadow:0 0 0 3px #ecdffb;}
  .wp.empty{opacity:.45;}
  .wicon{width:40px;height:40px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;font-size:20px;}
  .wname{font-weight:800;font-size:14.5px;line-height:1.1;}
  .wstats{font-size:11.5px;color:#9c8792;margin-top:3px;}
  .wammo{margin-left:auto;font-weight:800;color:var(--pink2);font-size:14px;white-space:nowrap;}
  .btn{margin-top:12px;border:none;border-radius:18px;padding:12px;font-family:inherit;
    font-weight:800;font-size:16px;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,var(--pink),var(--pink2));
    box-shadow:0 8px 18px -8px var(--pink2);transition:.12s;}
  .btn:hover{filter:brightness(1.04);transform:translateY(-1px);}
  .btn.ghost{background:var(--cream2);color:var(--ink);box-shadow:none;margin-top:8px;font-size:14px;padding:10px;}
  .btn.ghost.on{background:linear-gradient(180deg,var(--mint),#6fc389);color:#fff;}
  .legend{margin-top:auto;padding-top:12px;font-size:12px;color:var(--muted);line-height:1.6;}
  .legend kbd{background:var(--cream2);border-radius:6px;padding:1px 6px;font-family:inherit;font-weight:800;font-size:11px;}

  .overlay{position:fixed;inset:0;background:rgba(90,60,80,.4);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:30;padding:16px;}
  .card{background:var(--cream);border-radius:28px;padding:26px 30px;text-align:center;
    box-shadow:0 24px 60px -20px rgba(120,70,110,.6);max-width:400px;width:100%;}
  .card .big{font-size:44px;line-height:1;}
  .card h1{margin:8px 0 6px;font-size:27px;font-weight:800;}
  .card p{margin:0 0 14px;color:#9c8792;font-size:14.5px;line-height:1.5;}
  .roster{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 16px;}
  .roster span{background:var(--cream2);border-radius:14px;padding:6px 11px;font-size:13px;font-weight:700;}
  @media(max-width:820px){
    .game{grid-template-columns:1fr;}
    .panel{order:2;}
    .hud{padding-left:44px;}          /* keep clear of the floating 🏠 button */
  }
</style>
</head>
<body>
<a href="index.html" title="Home" style="position:fixed;top:10px;left:10px;z-index:100;text-decoration:none;
  width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.92);
  font-size:18px;box-shadow:0 8px 18px -8px rgba(180,120,160,.6);">🏠</a>
<div id="errbar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;
  background:#f194ac;color:#fff;font-family:system-ui,sans-serif;padding:10px 14px;
  font-size:13px;text-align:center;"></div>

<div class="game">
  <div class="stage">
    <div class="hud">
      <span class="title">🛡️ S.W.A.T. Creature Cleanup</span>
      <span class="hpwrap">❤️<span class="hpbar"><i id="hpfill"></i></span></span>
      <span class="chip">👾 Left <b id="left">0</b></span>
      <span class="chip">🚪 Zone <b id="zone">1</b>/8</span>
      <span class="chip">⭐<b id="score">0</b></span>
      <span class="chip" title="Set on the Choose Age page">🎂<b id="agechip">8</b></span>
    </div>
    <canvas id="cv" width="900" height="620"></canvas>
  </div>

  <div class="panel">
    <h2 id="zoneName">Zone 1</h2>
    <p class="hint" id="hint">Clear every creature out of the zone!</p>
    <div class="kit" id="kit"></div>
    <button class="btn ghost on" id="aimbtn">🎯 Auto-aim: On</button>
    <button class="btn ghost" id="pausebtn">⏸️ Pause</button>
    <div class="legend">
      <b>Move</b> <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows<br>
      <b>Shoot</b> hold the mouse button (or <kbd>Space</kbd>)<br>
      <b>Swap gun</b> <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> · <b>Pause</b> <kbd>P</kbd><br>
      <b>On a tablet:</b> drag the left half to walk, hold the right half to shoot.
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card">
    <div class="big" id="ovIcon">🛡️</div>
    <h1 id="ovTitle">Mission Briefing</h1>
    <p id="ovText"></p>
    <div class="roster" id="ovRoster"></div>
    <button class="btn" id="ovBtn">Start Mission</button>
  </div>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 900, H = 620;
const $ = id=>document.getElementById(id);
const TAU = Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);

// ---------- difficulty from the "Choose Age" page (1..100) ----------
let AGE = parseInt(localStorage.getItem('rm-age'), 10);
if(isNaN(AGE) || AGE<1 || AGE>100) AGE = 8;
const DIFF = 0.5 + (AGE-1)/99*2.0;      // 0.5 = easiest (age 1), 2.5 = hardest (age 100)
const HP_SCALE   = 0.6 + 0.4*DIFF;      // creature toughness
const SPD_SCALE  = 0.8 + 0.2*DIFF;      // creature speed
const HURT_SCALE = 0.6 + 0.4*DIFF;      // how hard they hit you
const COUNT_SCALE= 0.75 + 0.25*DIFF;    // how many show up

// ---------- guns ----------
const WEAPONS = [
  {id:'side',   name:'Sidearm',  emoji:'🔫', dmg:2.4, rate:.24,  spd:640, spread:.05, pellets:1, col:'#ffd98a', cap:Infinity, desc:'Never runs out'},
  {id:'scatter',name:'Scatter',  emoji:'💥', dmg:2.0, rate:.60,  spd:560, spread:.36, pellets:6, col:'#ffb24d', cap:80,  desc:'Six pellets at once'},
  {id:'rapid',  name:'Rapid',    emoji:'⚡', dmg:1.5, rate:.075, spd:720, spread:.10, pellets:1, col:'#8ed0a0', cap:300, desc:'Very fast little darts'},
  {id:'zapper', name:'Zapper',   emoji:'⭐', dmg:7,   rate:.72,  spd:840, spread:0,   pellets:1, col:'#cdb0ec', cap:60,  desc:'Zaps straight through', pierce:true},
];
const ammo = [Infinity, 12, 60, 8];

// ---------- creature kinds ----------
const KINDS = {
  blob:  {hp:6,  spd:46,  r:17, touch:9,  col:'#8ed0a0', dark:'#63b57c', pts:10, name:'Blobs'},
  zip:   {hp:3,  spd:112, r:12, touch:6,  col:'#b8a5ee', dark:'#9280d4', pts:15, name:'Zippers'},
  brute: {hp:26, spd:33,  r:26, touch:18, col:'#7fb6e8', dark:'#5f95c8', pts:30, name:'Brutes'},
  spit:  {hp:8,  spd:38,  r:16, touch:8,  col:'#ffb24d', dark:'#e2913a', pts:25, name:'Spitters', ranged:true, keep:210},
  split: {hp:13, spd:50,  r:21, touch:10, col:'#f7b6c8', dark:'#e08fa6', pts:20, name:'Splitters', splits:2},
  mini:  {hp:4,  spd:88,  r:11, touch:5,  col:'#f7b6c8', dark:'#e08fa6', pts:5,  name:'Splitlings'},
  boss:  {hp:260,spd:28,  r:44, touch:24, col:'#c98ce0', dark:'#a86ec0', pts:250,name:'the Big One', ranged:true, keep:150, boss:true},
};

// ---------- zone layouts (walls the creatures and pellets bump into) ----------
const LAYOUTS = [
  [ {x:150,y:120,w:120,h:34},{x:630,y:120,w:120,h:34},
    {x:150,y:466,w:120,h:34},{x:630,y:466,w:120,h:34},
    {x:420,y:270,w:60,h:80} ],
  [ {x:120,y:250,w:34,h:170},{x:746,y:250,w:34,h:170},
    {x:300,y:100,w:300,h:32},{x:300,y:488,w:300,h:32} ],
  [ {x:230,y:180,w:180,h:32},{x:490,y:180,w:180,h:32},
    {x:230,y:408,w:180,h:32},{x:490,y:408,w:180,h:32},
    {x:80,y:290,w:70,h:40},{x:750,y:290,w:70,h:40} ],
  [ {x:190,y:190,w:34,h:240},{x:676,y:190,w:34,h:240},
    {x:340,y:120,w:220,h:34},{x:340,y:466,w:220,h:34} ],
];

// ---------- the eight zones ----------
const ZONES = [
  {name:'The Lobby',      brief:'A few slime blobs squeezed in through the front door. Warm-up, officer.', pack:{blob:7}},
  {name:'The Corridor',   brief:'Zippers! They are quick — keep moving and lead your shots.',              pack:{blob:6, zip:6}},
  {name:'The Storeroom',  brief:'Big blue brutes are hiding behind the crates. Use the Scatter up close.', pack:{blob:5, brute:3}},
  {name:'The Vents',      brief:'Spitters lob slime from far away. Duck behind a crate, then pop them.',   pack:{zip:9, spit:5}},
  {name:'The Kitchen',    brief:'Careful: splitters break into two wriggly splitlings when they pop.',     pack:{blob:5, split:6}},
  {name:'The Basement',   brief:'Everything at once, and the lights are low. Watch your health bar.',      pack:{brute:4, spit:6, zip:8}},
  {name:'The Nest',       brief:'This is where they have been hatching. Clear it out completely.',         pack:{split:8, zip:8, brute:3}},
  {name:'The Big One',    brief:'The queen creature herself, and she keeps calling for help. Good luck!',  pack:{boss:1, zip:6, spit:4}},
];

// ---------- state ----------
const player = {x:W/2, y:H/2, r:15, hp:100, max:100, spd:205, ang:-Math.PI/2, cool:0, inv:0, kick:0, hurt:0};
player.max = Math.round(100*(1.4-0.3*DIFF)); player.hp = player.max;

let zone = 0, wp = 0, score = 0;
let creatures=[], shots=[], slime=[], parts=[], texts=[], pickups=[], spawners=[];
let queue=[], spawnTimer=0, walls=[], spawnPts=[];
let phase='brief';                        // brief | play | done | over | won | paused
let firing=false, shake=0, timeAlive=0;
let autoAim = AGE<=14;
const keys = new Set();
const mouse = {x:W/2, y:H/2-200, down:false, seen:false};

// ---------- gun panel ----------
const kitEl = $('kit');
WEAPONS.forEach((g,i)=>{
  const b=document.createElement('button');
  b.className='wp'; b.dataset.i=i; b.type='button';
  b.innerHTML=`<div class="wicon" style="background:${g.col}33">${g.emoji}</div>
    <div><div class="wname">${g.name}</div><div class="wstats">${g.desc}</div></div>
    <div class="wammo" id="am${i}"></div>`;
  b.onclick=()=>pickWeapon(i);
  kitEl.appendChild(b);
});
function pickWeapon(i){
  if(ammo[i]<=0) { say(`${WEAPONS[i].name} is out of ammo — pop creatures to find more.`); return; }
  wp=i; syncKit();
}
function syncKit(){
  WEAPONS.forEach((g,i)=>{
    const el=kitEl.children[i];
    el.classList.toggle('sel', i===wp);
    el.classList.toggle('empty', ammo[i]<=0);
    $('am'+i).textContent = ammo[i]===Infinity ? '∞' : ammo[i];
  });
}
function say(t){ $('hint').textContent = t; }
function sync(){
  $('hpfill').style.width = Math.max(0,player.hp/player.max*100)+'%';
  $('left').textContent = creatures.length + queue.length;
  $('zone').textContent = zone+1;
  $('score').textContent = score;
}

// ---------- input ----------
addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys.add(k);
  if(k>='1'&&k<='4') pickWeapon(+k-1);
  if(k==='p') togglePause();
  if(k===' ') firing=true;
});
addEventListener('keyup', e=>{
  const k=e.key.toLowerCase();
  keys.delete(k);
  if(k===' ') firing=false;
});
addEventListener('blur', ()=>{ keys.clear(); firing=false; mouse.down=false; touchMove.id=null; touchFire.id=null; });

function toCanvas(cx,cy){
  const r=cv.getBoundingClientRect();
  return {x:(cx-r.left)*(W/r.width), y:(cy-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove', e=>{ const p=toCanvas(e.clientX,e.clientY); mouse.x=p.x; mouse.y=p.y; mouse.seen=true; });
cv.addEventListener('mousedown', e=>{ e.preventDefault(); mouse.down=true; firing=true; });
addEventListener('mouseup', ()=>{ mouse.down=false; if(!keys.has(' ')) firing=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

// twin-stick style touch: left half walks, right half shoots
const touchMove = {id:null, ox:0, oy:0, x:0, y:0};
const touchFire = {id:null, x:0, y:0};
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=toCanvas(t.clientX,t.clientY);
    if(p.x < W*0.45 && touchMove.id===null){ touchMove.id=t.identifier; touchMove.ox=p.x; touchMove.oy=p.y; touchMove.x=p.x; touchMove.y=p.y; }
    else if(touchFire.id===null){ touchFire.id=t.identifier; touchFire.x=p.x; touchFire.y=p.y; firing=true; }
  }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=toCanvas(t.clientX,t.clientY);
    if(t.identifier===touchMove.id){ touchMove.x=p.x; touchMove.y=p.y; }
    if(t.identifier===touchFire.id){ touchFire.x=p.x; touchFire.y=p.y; mouse.x=p.x; mouse.y=p.y; }
  }
}, {passive:false});
function endTouch(e){
  for(const t of e.changedTouches){
    if(t.identifier===touchMove.id) touchMove.id=null;
    if(t.identifier===touchFire.id){ touchFire.id=null; firing=keys.has(' ')||mouse.down; }
  }
}
cv.addEventListener('touchend', endTouch);
cv.addEventListener('touchcancel', endTouch);

$('aimbtn').onclick=()=>{
  autoAim=!autoAim;
  $('aimbtn').textContent = '🎯 Auto-aim: ' + (autoAim?'On':'Off');
  $('aimbtn').classList.toggle('on', autoAim);
};
$('aimbtn').textContent = '🎯 Auto-aim: ' + (autoAim?'On':'Off');
$('aimbtn').classList.toggle('on', autoAim);
$('pausebtn').onclick=togglePause;
function togglePause(){
  if(phase==='play'){ phase='paused'; showCard('⏸️','Paused','Take a breath, officer.','Back to the mission'); }
  else if(phase==='paused'){ hideCard(); phase='play'; }
}

// ---------- building a zone ----------
function buildZone(){
  const z = ZONES[zone];
  walls = LAYOUTS[zone % LAYOUTS.length].map(w=>({...w}));
  creatures=[]; shots=[]; slime=[]; parts=[]; texts=[]; pickups=[]; spawners=[];
  player.x=W/2; player.y=H/2; player.inv=1.2; player.hurt=0; timeAlive=0;

  // spawn points around the rim, never inside a wall or on top of the player
  spawnPts=[];
  for(const p of [[70,70],[W/2,60],[W-70,70],[60,H/2],[W-60,H/2],[70,H-70],[W/2,H-60],[W-70,H-70],
                  [210,150],[W-210,150],[210,H-150],[W-210,H-150]]){
    const pt={x:p[0],y:p[1]};
    if(!walls.some(w=>circleHitsRect(pt.x,pt.y,34,w))) spawnPts.push(pt);
  }

  queue=[];
  for(const [kind,n] of Object.entries(z.pack)){
    const count = KINDS[kind].boss ? n : Math.max(1, Math.round(n*COUNT_SCALE));
    for(let i=0;i<count;i++) queue.push(kind);
  }
  // bosses first so she is on the field the whole fight, rest shuffled
  const boss = queue.filter(k=>KINDS[k].boss);
  const rest = queue.filter(k=>!KINDS[k].boss);
  for(let i=rest.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rest[i],rest[j]]=[rest[j],rest[i]]; }
  queue = boss.concat(rest);
  spawnTimer = .4;
  $('zoneName').textContent = `Zone ${zone+1} — ${z.name}`;
  say('Clear every creature out of the zone!');
  sync(); syncKit();
}

function maxAlive(){ return Math.round(6 + zone*1.2 + DIFF*2); }

function spawnFromQueue(){
  if(!queue.length) return;
  const kind=queue.shift();
  // pick the spawn point furthest from the player so nothing lands in your lap
  let best=spawnPts[0], bd=-1;
  for(const p of spawnPts){
    const d=Math.hypot(p.x-player.x,p.y-player.y)*rnd(.7,1.3);
    if(d>bd){bd=d;best=p;}
  }
  spawners.push({x:best.x, y:best.y, kind, t:.65});
}

function makeCreature(kind,x,y){
  const k=KINDS[kind];
  const hp=Math.max(1, Math.round(k.hp*HP_SCALE*(k.boss?1:(1+zone*0.06))));
  creatures.push({kind, x, y, r:k.r, hp, max:hp, spd:k.spd*SPD_SCALE*rnd(.92,1.08),
    col:k.col, dark:k.dark, touch:k.touch, bite:0, wob:rnd(0,TAU), flash:0,
    fire:rnd(1,2.2), boss:!!k.boss, ranged:!!k.ranged, keep:k.keep||0, pts:k.pts, splits:k.splits||0, call:4});
}

// ---------- geometry helpers ----------
function circleHitsRect(cx,cy,r,w){
  const nx=clamp(cx,w.x,w.x+w.w), ny=clamp(cy,w.y,w.y+w.h);
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}
function pushOutOfWalls(o){
  for(const w of walls){
    const nx=clamp(o.x,w.x,w.x+w.w), ny=clamp(o.y,w.y,w.y+w.h);
    const dx=o.x-nx, dy=o.y-ny, d2=dx*dx+dy*dy;
    if(d2 < o.r*o.r){
      if(d2>0.0001){ const d=Math.sqrt(d2); o.x=nx+dx/d*o.r; o.y=ny+dy/d*o.r; }
      else{ // dead centre: shove out the nearest side
        const l=o.x-w.x, rr=w.x+w.w-o.x, t=o.y-w.y, b=w.y+w.h-o.y;
        const m=Math.min(l,rr,t,b);
        if(m===l) o.x=w.x-o.r; else if(m===rr) o.x=w.x+w.w+o.r;
        else if(m===t) o.y=w.y-o.r; else o.y=w.y+w.h+o.r;
      }
    }
  }
  o.x=clamp(o.x,o.r,W-o.r); o.y=clamp(o.y,o.r,H-o.r);
}
function pointInWall(x,y){ return walls.some(w=>x>w.x&&x<w.x+w.w&&y>w.y&&y<w.y+w.h); }

// ---------- shooting ----------
function fire(){
  const g=WEAPONS[wp];
  if(ammo[wp]<=0){ if(wp!==0){ wp=0; syncKit(); say('Out of ammo — back to the Sidearm.'); } return; }
  player.cool=g.rate; player.kick=1;
  if(ammo[wp]!==Infinity){ ammo[wp]--; syncKit(); }
  for(let i=0;i<g.pellets;i++){
    const a=player.ang + (g.pellets>1 ? rnd(-g.spread,g.spread) : rnd(-g.spread,g.spread)*.5);
    shots.push({x:player.x+Math.cos(player.ang)*20, y:player.y+Math.sin(player.ang)*20,
      vx:Math.cos(a)*g.spd, vy:Math.sin(a)*g.spd, dmg:g.dmg, col:g.col, life:1.1,
      pierce:!!g.pierce, hit:new Set(), r:g.pierce?5:3.5});
  }
  for(let i=0;i<4;i++) parts.push({x:player.x+Math.cos(player.ang)*24, y:player.y+Math.sin(player.ang)*24,
    vx:Math.cos(player.ang)*rnd(40,140)+rnd(-40,40), vy:Math.sin(player.ang)*rnd(40,140)+rnd(-40,40),
    r:rnd(1.5,3), col:'#ffe6b0', life:.16, max:.16});
  shake=Math.max(shake, g.pellets>1?5:2);
}

function popCreature(c){
  score+=c.pts; c.dead=true;
  texts.push({x:c.x,y:c.y,t:0,txt:'+'+c.pts,col:'#ffb24d'});
  for(let i=0;i<(c.boss?40:12);i++){
    const a=rnd(0,TAU), s=rnd(50,c.boss?320:190);
    parts.push({x:c.x,y:c.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:rnd(2,c.boss?9:6),col:i%3?c.col:'#ffffff',life:.5,max:.5});
  }
  shake=Math.max(shake, c.boss?18:4);
  if(c.splits){ for(let i=0;i<c.splits;i++){ makeCreature('mini', c.x+rnd(-14,14), c.y+rnd(-14,14)); } }
  // drops
  const roll=Math.random();
  if(c.boss){ dropPickup(c.x-30,c.y,'health'); dropPickup(c.x+30,c.y,'ammo'); dropPickup(c.x,c.y+30,'ammo'); }
  else if(roll<0.13 && player.hp<player.max) dropPickup(c.x,c.y,'health');
  else if(roll<0.42) dropPickup(c.x,c.y,'ammo');
  sync();
}
function dropPickup(x,y,type){
  let w=0;
  if(type==='ammo'){ w = 1+Math.floor(Math.random()*3); }   // scatter, rapid or zapper
  pickups.push({x:clamp(x,20,W-20), y:clamp(y,20,H-20), type, w, t:0});
}

function hurtPlayer(dmg){
  if(player.inv>0) return;
  player.hp -= dmg*HURT_SCALE;
  player.inv = .55; player.hurt = 1; shake=Math.max(shake,9);
  sync();
  if(player.hp<=0){ player.hp=0; sync(); endZone(false); }
}

// ---------- main loop ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(phase==='play') update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt){
  timeAlive+=dt;
  player.inv=Math.max(0,player.inv-dt);
  player.hurt=Math.max(0,player.hurt-dt*2);
  player.kick=Math.max(0,player.kick-dt*6);
  shake=Math.max(0,shake-dt*40);

  // --- move ---
  let mx=0,my=0;
  if(keys.has('a')||keys.has('arrowleft'))  mx-=1;
  if(keys.has('d')||keys.has('arrowright')) mx+=1;
  if(keys.has('w')||keys.has('arrowup'))    my-=1;
  if(keys.has('s')||keys.has('arrowdown'))  my+=1;
  if(touchMove.id!==null){
    const dx=touchMove.x-touchMove.ox, dy=touchMove.y-touchMove.oy, d=Math.hypot(dx,dy);
    if(d>8){ const k=Math.min(1,d/60); mx=dx/d*k; my=dy/d*k; }
  }
  const ml=Math.hypot(mx,my);
  if(ml>1){ mx/=ml; my/=ml; }
  player.x+=mx*player.spd*dt; player.y+=my*player.spd*dt;
  pushOutOfWalls(player);

  // --- aim ---
  let target=null;
  if(autoAim){
    let best=1e9;
    for(const c of creatures){
      const d=Math.hypot(c.x-player.x,c.y-player.y);
      if(d<best){best=d;target=c;}
    }
  }
  if(target) player.ang=Math.atan2(target.y-player.y, target.x-player.x);
  else if(touchFire.id!==null) player.ang=Math.atan2(touchFire.y-player.y, touchFire.x-player.x);
  else if(mouse.seen) player.ang=Math.atan2(mouse.y-player.y, mouse.x-player.x);

  // --- shoot ---
  player.cool-=dt;
  if(firing && player.cool<=0) fire();

  // --- spawning ---
  if(queue.length){
    spawnTimer-=dt;
    const alive=creatures.length+spawners.length;
    if(spawnTimer<=0 && alive<maxAlive()){
      spawnFromQueue();
      spawnTimer=Math.max(.35, 1.15-zone*.07)/Math.max(.6,COUNT_SCALE);
    }
  }
  for(const s of spawners){
    s.t-=dt;
    if(s.t<=0){ makeCreature(s.kind,s.x,s.y); s.done=true; }
  }
  spawners=spawners.filter(s=>!s.done);

  // --- creatures ---
  for(const c of creatures){
    c.wob+=dt*6; c.flash=Math.max(0,c.flash-dt*5); c.bite=Math.max(0,c.bite-dt);
    const dx=player.x-c.x, dy=player.y-c.y, d=Math.hypot(dx,dy)||1;
    let ux=dx/d, uy=dy/d;
    if(c.keep){                                  // spitters hover at a distance
      if(d < c.keep-30){ ux=-ux; uy=-uy; }
      else if(d < c.keep+30){ const t=Math.atan2(uy,ux)+Math.PI/2; ux=Math.cos(t); uy=Math.sin(t); }
    }
    c.x+=ux*c.spd*dt; c.y+=uy*c.spd*dt;

    // creatures nudge each other apart so they do not stack into one lump
    for(const o of creatures){
      if(o===c) continue;
      const ox=c.x-o.x, oy=c.y-o.y, od=Math.hypot(ox,oy);
      const min=c.r+o.r;
      if(od>0.001 && od<min){ const push=(min-od)*.5; c.x+=ox/od*push; c.y+=oy/od*push; }
    }
    pushOutOfWalls(c);

    // ranged attack
    if(c.ranged){
      c.fire-=dt;
      if(c.fire<=0 && d<380){
        c.fire = c.boss ? rnd(1.1,1.8)/Math.max(.7,DIFF*.6) : rnd(1.6,2.6)/Math.max(.7,DIFF*.6);
        const shots_n = c.boss?5:1, sp=c.boss?.30:0;
        const base=Math.atan2(dy,dx);
        for(let i=0;i<shots_n;i++){
          const a=base+(i-(shots_n-1)/2)*sp;
          slime.push({x:c.x,y:c.y,vx:Math.cos(a)*185,vy:Math.sin(a)*185,r:7,life:3,dmg:c.boss?9:7});
        }
      }
      if(c.boss){                                 // the queen calls for backup
        c.call-=dt;
        if(c.call<=0){ c.call=rnd(6,9); for(let i=0;i<2;i++) queue.push('zip'); sync();
          texts.push({x:c.x,y:c.y-c.r-14,t:0,txt:'more coming!',col:'#c98ce0'}); }
      }
    }

    // contact
    if(d < c.r+player.r && c.bite<=0){
      hurtPlayer(c.touch); c.bite=.75;
      player.x-=ux*16; player.y-=uy*16; pushOutOfWalls(player);
    }
  }

  // --- player shots ---
  for(const s of shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(s.x<0||s.x>W||s.y<0||s.y>H||pointInWall(s.x,s.y)){
      if(s.life>0) for(let i=0;i<3;i++) parts.push({x:s.x,y:s.y,vx:rnd(-60,60),vy:rnd(-60,60),r:rnd(1,2.5),col:'#cfd8e8',life:.22,max:.22});
      s.life=0; continue;
    }
    for(const c of creatures){
      if(c.dead || s.hit.has(c)) continue;
      if(Math.hypot(c.x-s.x,c.y-s.y) < c.r+s.r){
        c.hp-=s.dmg; c.flash=1; s.hit.add(c);
        for(let i=0;i<3;i++) parts.push({x:s.x,y:s.y,vx:rnd(-90,90),vy:rnd(-90,90),r:rnd(1.5,3),col:c.col,life:.3,max:.3});
        if(c.hp<=0) popCreature(c);
        if(!s.pierce){ s.life=0; break; }
      }
    }
  }
  shots=shots.filter(s=>s.life>0);

  // --- creature slime ---
  for(const b of slime){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.x<0||b.x>W||b.y<0||b.y>H||pointInWall(b.x,b.y)) b.life=0;
    else if(Math.hypot(player.x-b.x,player.y-b.y)<player.r+b.r){ hurtPlayer(b.dmg); b.life=0; }
  }
  slime=slime.filter(b=>b.life>0);
  creatures=creatures.filter(c=>!c.dead);

  // --- pickups ---
  for(const p of pickups){
    p.t+=dt;
    if(Math.hypot(player.x-p.x,player.y-p.y) < player.r+16){
      if(p.type==='health'){
        player.hp=Math.min(player.max, player.hp+22);
        texts.push({x:p.x,y:p.y,t:0,txt:'+22 health',col:'#8ed0a0'});
      } else {
        const g=WEAPONS[p.w], add=[0,10,45,6][p.w];
        ammo[p.w]=Math.min(g.cap, ammo[p.w]+add);
        texts.push({x:p.x,y:p.y,t:0,txt:`+${add} ${g.name}`,col:g.col});
        if(ammo[wp]<=0) { wp=p.w; }
        syncKit();
      }
      p.gone=true; sync();
    }
    if(p.t>22) p.gone=true;
  }
  pickups=pickups.filter(p=>!p.gone);

  // --- effects ---
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.92; p.vy*=.92; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
  for(const t of texts) t.t+=dt;
  texts=texts.filter(t=>t.t<1.1);

  sync();

  // --- zone cleared? ---
  if(!creatures.length && !queue.length && !spawners.length) endZone(true);
}

// ---------- zone start / end ----------
function showCard(icon,title,text,btn,roster){
  $('ovIcon').textContent=icon; $('ovTitle').textContent=title;
  $('ovText').textContent=text; $('ovBtn').textContent=btn;
  $('ovRoster').innerHTML = roster ? roster.map(r=>`<span>${r}</span>`).join('') : '';
  $('overlay').style.display='flex';
}
function hideCard(){ $('overlay').style.display='none'; }

function briefing(){
  phase='brief';
  const z=ZONES[zone];
  const roster=Object.entries(z.pack).map(([k,n])=>{
    const kk=KINDS[k];
    const emo={blob:'🟢',zip:'🟣',brute:'🔵',spit:'🟠',split:'🩷',boss:'👑'}[k]||'👾';
    return `${emo} ${kk.name}`;
  });
  showCard('🛡️', `Zone ${zone+1} — ${z.name}`, z.brief, zone===0?'Start Mission':'Move in', roster);
  buildZone();
}

function endZone(win){
  if(phase!=='play') return;
  if(!win){
    phase='over'; firing=false;
    showCard('😵','Officer down!',`The creatures got you in ${ZONES[zone].name}. Squad medic says you can go again — same zone, full health.`,'Try this zone again');
    return;
  }
  firing=false;
  const bonus=100+zone*50;
  score+=bonus; sync();
  if(zone>=ZONES.length-1){
    phase='won';
    showCard('🏆','Building clear!',`Every creature in all eight zones is gone. Final score ${score}. Rabbit and Memo salute you, officer.`,'Play again');
  } else {
    phase='done';
    ammo[1]=Math.min(WEAPONS[1].cap,ammo[1]+6);
    ammo[2]=Math.min(WEAPONS[2].cap,ammo[2]+30);
    ammo[3]=Math.min(WEAPONS[3].cap,ammo[3]+3);
    player.hp=Math.min(player.max, player.hp+30);
    syncKit(); sync();
    showCard('✅','Zone clear!',`Nice work. +${bonus} points, some ammo from the supply drop, and +30 health. Next up: ${ZONES[zone+1].name}.`,'Next zone →');
  }
}

$('ovBtn').onclick=()=>{
  if(phase==='brief'){ hideCard(); phase='play'; last=performance.now(); }
  else if(phase==='paused'){ hideCard(); phase='play'; last=performance.now(); }
  else if(phase==='done'){ zone++; briefing(); }
  else if(phase==='over'){ player.hp=player.max; hideCard(); buildZone(); phase='play'; last=performance.now(); }
  else if(phase==='won'){ location.reload(); }
};

// ---------- drawing ----------
function draw(){
  ctx.save();
  if(shake>0.2) ctx.translate(rnd(-shake,shake)*.4, rnd(-shake,shake)*.4);
  drawFloor();
  for(const w of walls) drawWall(w);
  for(const p of pickups) drawPickup(p);
  for(const s of spawners) drawSpawner(s);
  for(const c of creatures) drawCreature(c);
  for(const b of slime) drawSlime(b);
  for(const s of shots) drawShot(s);
  drawPlayer();
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.life/p.max);
    ctx.fillStyle=p.col; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(const t of texts){
    ctx.globalAlpha=Math.max(0,1-t.t); ctx.fillStyle=t.col;
    ctx.font='800 17px ui-rounded, system-ui, sans-serif'; ctx.textAlign='center';
    ctx.fillText(t.txt, t.x, t.y-16-t.t*26);
  }
  ctx.globalAlpha=1;
  if(player.hurt>0){
    ctx.fillStyle=`rgba(241,148,172,${player.hurt*.35})`; ctx.fillRect(0,0,W,H);
  }
  drawTouchStick();
  ctx.restore();
  if(phase==='brief'||phase==='paused'||phase==='done'||phase==='over'||phase==='won'){
    ctx.fillStyle='rgba(232,238,247,.55)'; ctx.fillRect(0,0,W,H);
  }
}

function drawFloor(){
  ctx.fillStyle='#e8eef7'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#dbe3f0'; ctx.lineWidth=2;
  for(let x=60;x<W;x+=60){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke(); }
  for(let y=60;y<H;y+=60){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke(); }
  ctx.strokeStyle='#c9d4e6'; ctx.lineWidth=10;
  ctx.strokeRect(5,5,W-10,H-10);
}
function drawWall(w){
  ctx.fillStyle='rgba(120,110,140,.16)'; roundRect(w.x+4,w.y+7,w.w,w.h,10); ctx.fill();
  ctx.fillStyle='#c9b59a'; roundRect(w.x,w.y,w.w,w.h,10); ctx.fill();
  ctx.fillStyle='#e0cfb6'; roundRect(w.x+5,w.y+5,w.w-10,w.h-10,7); ctx.fill();
  ctx.strokeStyle='#b39d80'; ctx.lineWidth=2; roundRect(w.x,w.y,w.w,w.h,10); ctx.stroke();
}
function drawSpawner(s){
  const k=1-s.t/.65;
  ctx.strokeStyle='#f194ac'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(s.x,s.y,10+k*24,0,TAU); ctx.stroke();
  ctx.fillStyle=`rgba(241,148,172,${.25*(1-k)+.1})`;
  ctx.beginPath(); ctx.arc(s.x,s.y,10+k*24,0,TAU); ctx.fill();
  ctx.fillStyle='#f194ac'; ctx.font='800 15px ui-rounded, system-ui, sans-serif'; ctx.textAlign='center';
  ctx.fillText('!', s.x, s.y+5);
}
function drawPickup(p){
  const bob=Math.sin(p.t*4)*3, fade = p.t>18 ? (Math.sin(p.t*14)>0?.35:1) : 1;
  ctx.globalAlpha=fade;
  ctx.fillStyle='rgba(120,110,140,.16)';
  ctx.beginPath(); ctx.ellipse(p.x,p.y+13,13,5,0,0,TAU); ctx.fill();
  if(p.type==='health'){
    ctx.fillStyle='#fff'; roundRect(p.x-13,p.y-13+bob,26,26,8); ctx.fill();
    ctx.strokeStyle='#8ed0a0'; ctx.lineWidth=2.5; roundRect(p.x-13,p.y-13+bob,26,26,8); ctx.stroke();
    ctx.fillStyle='#8ed0a0'; ctx.fillRect(p.x-8,p.y-3+bob,16,6); ctx.fillRect(p.x-3,p.y-8+bob,6,16);
  } else {
    const g=WEAPONS[p.w];
    ctx.fillStyle='#fff'; roundRect(p.x-14,p.y-12+bob,28,24,8); ctx.fill();
    ctx.strokeStyle=g.col; ctx.lineWidth=2.5; roundRect(p.x-14,p.y-12+bob,28,24,8); ctx.stroke();
    ctx.font='15px system-ui, sans-serif'; ctx.textAlign='center';
    ctx.fillText(g.emoji, p.x, p.y+6+bob);
  }
  ctx.globalAlpha=1;
}
function drawShot(s){
  ctx.strokeStyle=s.col; ctx.lineWidth=s.pierce?5:3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.vx*.018, s.y-s.vy*.018); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.pierce?3:2,0,TAU); ctx.fill();
}
function drawSlime(b){
  ctx.fillStyle='rgba(226,145,58,.35)';
  ctx.beginPath(); ctx.arc(b.x,b.y,b.r+3,0,TAU); ctx.fill();
  ctx.fillStyle='#e2913a'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(b.x-2,b.y-2,2.4,0,TAU); ctx.fill();
}

function drawCreature(c){
  const wob=Math.sin(c.wob)*2;
  ctx.fillStyle='rgba(120,110,140,.18)';
  ctx.beginPath(); ctx.ellipse(c.x,c.y+c.r*.85,c.r*.95,c.r*.35,0,0,TAU); ctx.fill();
  // body
  ctx.fillStyle = c.flash>0 ? '#ffffff' : c.col;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.r+wob*.4, c.r-wob*.4, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle=c.dark; ctx.lineWidth=2.5; ctx.stroke();
  // little wobbly feet
  ctx.fillStyle=c.dark;
  ctx.beginPath(); ctx.arc(c.x-c.r*.45, c.y+c.r*.75, c.r*.22,0,TAU);
  ctx.arc(c.x+c.r*.45, c.y+c.r*.75, c.r*.22,0,TAU); ctx.fill();
  // eyes look at the player
  const a=Math.atan2(player.y-c.y, player.x-c.x), ex=Math.cos(a)*c.r*.16, ey=Math.sin(a)*c.r*.16;
  const eo=c.r*.34, er=c.r*.24;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(c.x-eo, c.y-c.r*.12, er,0,TAU); ctx.arc(c.x+eo, c.y-c.r*.12, er,0,TAU); ctx.fill();
  ctx.fillStyle='#3f3546';
  ctx.beginPath(); ctx.arc(c.x-eo+ex, c.y-c.r*.12+ey, er*.5,0,TAU); ctx.arc(c.x+eo+ex, c.y-c.r*.12+ey, er*.5,0,TAU); ctx.fill();
  if(c.kind==='brute'||c.boss){       // grumpy brows
    ctx.strokeStyle='#3f3546'; ctx.lineWidth=c.boss?4:3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(c.x-eo-er,c.y-c.r*.5); ctx.lineTo(c.x-eo+er,c.y-c.r*.34);
    ctx.moveTo(c.x+eo+er,c.y-c.r*.5); ctx.lineTo(c.x+eo-er,c.y-c.r*.34); ctx.stroke();
  }
  if(c.boss){                          // crown
    ctx.fillStyle='#ffd98a';
    ctx.beginPath();
    ctx.moveTo(c.x-24,c.y-c.r-4); ctx.lineTo(c.x-16,c.y-c.r-22); ctx.lineTo(c.x-8,c.y-c.r-8);
    ctx.lineTo(c.x,c.y-c.r-26); ctx.lineTo(c.x+8,c.y-c.r-8); ctx.lineTo(c.x+16,c.y-c.r-22);
    ctx.lineTo(c.x+24,c.y-c.r-4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#e8bf6a'; ctx.lineWidth=2; ctx.stroke();
  }
  // health bar for the tough ones
  if(c.max>8){
    const w=c.r*2.1, hw=w*Math.max(0,c.hp/c.max), y=c.y-c.r-(c.boss?34:12);
    ctx.fillStyle='rgba(255,255,255,.75)'; roundRect(c.x-w/2,y,w,6,3); ctx.fill();
    ctx.fillStyle=c.boss?'#f194ac':'#8ed0a0'; roundRect(c.x-w/2,y,hw,6,3); ctx.fill();
  }
}

function drawPlayer(){
  const blink = player.inv>0 && Math.floor(player.inv*14)%2===0;
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle='rgba(120,110,140,.2)';
  ctx.beginPath(); ctx.ellipse(0,14,16,6,0,0,TAU); ctx.fill();
  ctx.rotate(player.ang+Math.PI/2);          // art is drawn facing "up"
  if(blink) ctx.globalAlpha=.45;
  const FUR='#fffaf4', FURLINE='#dfcec1';
  ctx.lineWidth=2; ctx.fillStyle=FUR; ctx.strokeStyle=FURLINE;
  // tail, behind
  ctx.beginPath(); ctx.arc(0,19,6.5,0,TAU); ctx.fill(); ctx.stroke();
  // long ears flanking the helmet
  ctx.beginPath(); ctx.ellipse(-15,-9,5.5,18,.2,0,TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(15,-9,5.5,18,-.2,0,TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fcd7e4';
  ctx.beginPath(); ctx.ellipse(-15,-11,2.6,11,.2,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(15,-11,2.6,11,-.2,0,TAU); ctx.fill();
  // fluffy body
  ctx.fillStyle=FUR; ctx.strokeStyle=FURLINE;
  ctx.beginPath(); ctx.ellipse(0,3,18,17,0,0,TAU); ctx.fill(); ctx.stroke();
  // navy vest
  ctx.fillStyle='#5b6b8f'; ctx.strokeStyle='#3f4c68';
  roundRect(-14,-4,28,20,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#48587a'; roundRect(-14,3,28,6,3); ctx.fill();
  ctx.fillStyle='#ffd98a'; roundRect(-4,4,8,4,2); ctx.fill();
  ctx.fillStyle='#e7ecf7'; ctx.font='800 7px ui-rounded, system-ui, sans-serif'; ctx.textAlign='center';
  ctx.fillText('SWAT',0,0);
  // the gun, held out front in both paws
  const g=WEAPONS[wp], k=player.kick*3;
  ctx.fillStyle='#8a8f9c'; ctx.strokeStyle='#6d7486'; ctx.lineWidth=1.6;
  roundRect(1,-34+k,9,25,4); ctx.fill(); ctx.stroke();
  roundRect(-5,-13,15,7,3); ctx.fill(); ctx.stroke();
  ctx.fillStyle=g.col; ctx.strokeStyle='rgba(0,0,0,.16)';
  ctx.beginPath(); ctx.arc(5.5,-33+k,5.5,0,TAU); ctx.fill(); ctx.stroke();
  if(player.kick>.6){                         // muzzle flash
    ctx.fillStyle='rgba(255,222,150,.9)';
    ctx.beginPath(); ctx.moveTo(1,-36+k); ctx.lineTo(5.5,-46+k); ctx.lineTo(10,-36+k); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle=FUR; ctx.strokeStyle=FURLINE; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(-4,-11,5,0,TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(9,-17,4.5,0,TAU); ctx.fill(); ctx.stroke();
  // helmet + visor, on top of everything
  ctx.fillStyle='#3f4c68'; ctx.strokeStyle='#2f3a52';
  ctx.beginPath(); ctx.arc(0,-6,11.5,0,TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8fd3e8'; roundRect(-9.5,-14,19,8.5,4); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.6)'; roundRect(-7.5,-13,7,3.4,1.7); ctx.fill();
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawTouchStick(){
  if(touchMove.id===null) return;
  ctx.strokeStyle='rgba(91,107,143,.35)'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(touchMove.ox,touchMove.oy,44,0,TAU); ctx.stroke();
  const dx=touchMove.x-touchMove.ox, dy=touchMove.y-touchMove.oy, d=Math.hypot(dx,dy)||1;
  const k=Math.min(1,d/60);
  ctx.fillStyle='rgba(91,107,143,.45)';
  ctx.beginPath(); ctx.arc(touchMove.ox+dx/d*44*k, touchMove.oy+dy/d*44*k, 20,0,TAU); ctx.fill();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

// ---------- go ----------
window.addEventListener('error', e=>{
  const b=$('errbar');
  if(b){ b.style.display='block'; b.textContent='Oops: '+(e.message||e.error||'unknown error'); }
});
try{
  $('agechip').textContent = AGE;
  syncKit();
  briefing();
  draw();
  requestAnimationFrame(loop);
}catch(err){
  const b=$('errbar');
  if(b){ b.style.display='block'; b.textContent='Oops: '+err.message; }
}
